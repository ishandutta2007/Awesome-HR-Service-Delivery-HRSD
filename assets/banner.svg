<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090D16"/><stop offset="50%" stop-color="#0F172A"/><stop offset="100%" stop-color="#1E1B4B"/></linearGradient><linearGradient id="accentGradient" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#818CF8"/><stop offset="100%" stop-color="#C084FC"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1E293B" stop-opacity=".8"/><stop offset="100%" stop-color="#334155" stop-opacity=".6"/></linearGradient><filter id="glowBlur" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="60"/></filter><filter id="softGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="20"/></filter><pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".18" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#64748B" fill-opacity=".25"/></pattern></defs><style>@keyframes floatOrb1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,-30px) scale(1.15)}}@keyframes floatOrb2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,40px) scale(1.1)}}@keyframes floatPill1{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes floatPill2{0%{transform:translateY(0)}50%{transform:translateY(14px)}}@keyframes shimmer{0%{stop-color:#38bdf8}50%{stop-color:#a855f7}}@keyframes pulseLine{0%{opacity:.7;stroke-width:2.5}50%{opacity:1;stroke-width:3.5}}.orb1{animation:floatOrb1 12s ease-in-out infinite}.orb2{animation:floatOrb2 15s ease-in-out infinite}.pill1{animation:floatPill1 6s ease-in-out infinite}.pill2{animation:floatPill2 7s ease-in-out infinite}.pulse-bar{animation:pulseLine 4s ease-in-out infinite}.title-text{font-weight:800;letter-spacing:-.5px}.sub-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.sub-text{font-weight:500;letter-spacing:.5px}.tag-text{font-weight:600;font-size:13px}</style><rect width="1200" height="400" fill="url(#bgGradient)" rx="16"/><rect width="1200" height="400" fill="url(#gridPattern)" rx="16"/><g opacity=".45"><circle cx="220" cy="110" r="130" fill="#38BDF8" class="orb1" filter="url(#glowBlur)"/><circle cx="980" cy="290" r="150" fill="#818CF8" class="orb2" filter="url(#glowBlur)"/><circle cx="600" cy="350" r="110" fill="#C084FC" class="orb1" filter="url(#glowBlur)"/></g><g class="pill1" transform="translate(60, 50)"><rect width="160" height="34" fill="url(#pillGrad1)" stroke="#38BDF8" stroke-opacity=".4" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#38BDF8"/><text x="35" y="22" fill="#E2E8F0" class="tag-text">HR Case Mgmt</text></g><g class="pill2" transform="translate(980, 50)"><rect width="160" height="34" fill="url(#pillGrad1)" stroke="#818CF8" stroke-opacity=".4" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#818CF8"/><text x="35" y="22" fill="#E2E8F0" class="tag-text">SLA &amp; AI Agents</text></g><g class="pill2" transform="translate(70, 315)"><rect width="175" height="34" fill="url(#pillGrad1)" stroke="#A855F7" stroke-opacity=".4" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#A855F7"/><text x="35" y="22" fill="#E2E8F0" class="tag-text">Employee Portal</text></g><g class="pill1" transform="translate(965, 315)"><rect width="175" height="34" fill="url(#pillGrad1)" stroke="#38BDF8" stroke-opacity=".4" stroke-width="1.2" rx="17"/><circle cx="20" cy="17" r="5" fill="#38BDF8"/><text x="35" y="22" fill="#E2E8F0" class="tag-text">Self-Hosted HRMS</text></g><g transform="translate(485, 80)"><rect width="230" height="28" fill="#1E293B" stroke="url(#accentGradient)" stroke-width="1.2" rx="14"/><text x="115" y="19" fill="#93C5FD" class="sub-text" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">CURATED HR TECH ECOSYSTEM</text></g><text x="600" y="165" fill="#FFF" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))" font-size="46" text-anchor="middle">Awesome HR Service Delivery</text><line x1="420" x2="780" y1="188" y2="188" stroke="url(#accentGradient)" stroke-linecap="round" class="pulse-bar"/><text x="600" y="225" fill="#CBD5E1" class="sub-text" font-size="18" text-anchor="middle">HRSD Platforms • Enterprise HCM Suites • Open-Source Self-Hosted HRMS</text><g transform="translate(250, 255)"><rect width="210" height="32" x="0" y="0" fill="#1E293B" stroke="#475569" stroke-width="1" opacity=".9" rx="16"/><text x="105" y="20" fill="#E2E8F0" class="tag-text" text-anchor="middle">💼 Case &amp; Service Desk</text><rect width="210" height="32" x="245" y="0" fill="#1E293B" stroke="#475569" stroke-width="1" opacity=".9" rx="16"/><text x="350" y="20" fill="#E2E8F0" class="tag-text" text-anchor="middle">📊 Real Starting Prices</text><rect width="210" height="32" x="490" y="0" fill="#1E293B" stroke="#475569" stroke-width="1" opacity=".9" rx="16"/><text x="595" y="20" fill="#E2E8F0" class="tag-text" text-anchor="middle">⭐ Free Tiers &amp; Trials</text></g></svg>