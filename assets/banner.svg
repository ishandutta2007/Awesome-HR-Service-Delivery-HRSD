<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#334155" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.18" />
      <circle cx="40" cy="40" r="1.5" fill="#64748B" fill-opacity="0.25" />
    </pattern>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(50px, -30px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-40px, 40px) scale(1.1); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(14px); }
    }
    @keyframes shimmer {
      0% { stop-color: #38BDF8; }
      50% { stop-color: #A855F7; }
      100% { stop-color: #38BDF8; }
    }
    @keyframes pulseLine {
      0%, 100% { opacity: 0.7; stroke-width: 2.5; }
      50% { opacity: 1; stroke-width: 3.5; }
    }

    .orb1 { animation: floatOrb1 12s ease-in-out infinite; }
    .orb2 { animation: floatOrb2 15s ease-in-out infinite; }
    .pill1 { animation: floatPill1 6s ease-in-out infinite; }
    .pill2 { animation: floatPill2 7s ease-in-out infinite; }
    .pulse-bar { animation: pulseLine 4s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#gridPattern)" rx="16" />

  <!-- Animated Ambient Glow Orbs in Background -->
  <g opacity="0.45">
    <circle cx="220" cy="110" r="130" fill="#38BDF8" filter="url(#glowBlur)" class="orb1" />
    <circle cx="980" cy="290" r="150" fill="#818CF8" filter="url(#glowBlur)" class="orb2" />
    <circle cx="600" cy="350" r="110" fill="#C084FC" filter="url(#glowBlur)" class="orb1" />
  </g>

  <!-- Floating Peripheral Badges / Workflow Pills (Non-Obstructive) -->
  <!-- Top Left Pill -->
  <g class="pill1" transform="translate(60, 50)">
    <rect width="160" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="35" y="22" fill="#E2E8F0" class="tag-text">HR Case Mgmt</text>
  </g>

  <!-- Top Right Pill -->
  <g class="pill2" transform="translate(980, 50)">
    <rect width="160" height="34" rx="17" fill="url(#pillGrad1)" stroke="#818CF8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#818CF8" />
    <text x="35" y="22" fill="#E2E8F0" class="tag-text">SLA &amp; AI Agents</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="pill2" transform="translate(70, 315)">
    <rect width="175" height="34" rx="17" fill="url(#pillGrad1)" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#A855F7" />
    <text x="35" y="22" fill="#E2E8F0" class="tag-text">Employee Portal</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="pill1" transform="translate(965, 315)">
    <rect width="175" height="34" rx="17" fill="url(#pillGrad1)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="20" cy="17" r="5" fill="#38BDF8" />
    <text x="35" y="22" fill="#E2E8F0" class="tag-text">Self-Hosted HRMS</text>
  </g>

  <!-- Central Foreground Content (Unobstructed & High-Contrast) -->
  <!-- Category Over-Title Chip -->
  <g transform="translate(485, 80)">
    <rect width="230" height="28" rx="14" fill="#1E293B" stroke="url(#accentGradient)" stroke-width="1.2" />
    <text x="115" y="19" fill="#93C5FD" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.5" class="sub-text">CURATED HR TECH ECOSYSTEM</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="165" text-anchor="middle" font-size="46" fill="#FFFFFF" class="title-text" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">
    Awesome HR Service Delivery
  </text>

  <!-- Accent Shimmer Line Under Title -->
  <line x1="420" y1="188" x2="780" y2="188" stroke="url(#accentGradient)" class="pulse-bar" stroke-linecap="round" />

  <!-- Subtitle -->
  <text x="600" y="225" text-anchor="middle" font-size="18" fill="#CBD5E1" class="sub-text">
    HRSD Platforms • Enterprise HCM Suites • Open-Source Self-Hosted HRMS
  </text>

  <!-- Key Pillar Feature Chips (Middle Row) -->
  <g transform="translate(250, 255)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="210" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" opacity="0.9" />
    <text x="105" y="20" fill="#E2E8F0" text-anchor="middle" class="tag-text">💼 Case &amp; Service Desk</text>

    <!-- Chip 2 -->
    <rect x="245" y="0" width="210" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" opacity="0.9" />
    <text x="350" y="20" fill="#E2E8F0" text-anchor="middle" class="tag-text">📊 Real Starting Prices</text>

    <!-- Chip 3 -->
    <rect x="490" y="0" width="210" height="32" rx="16" fill="#1E293B" stroke="#475569" stroke-width="1" opacity="0.9" />
    <text x="595" y="20" fill="#E2E8F0" text-anchor="middle" class="tag-text">⭐ Free Tiers &amp; Trials</text>
  </g>
</svg>
